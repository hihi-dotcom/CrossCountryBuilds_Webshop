<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <h1>hehe</h1>
    <button id="theButton">THE BUTTON</button>
    <script>
        async function doSomething(e) {
            const response = await fetch("http://127.0.0.1:30000/", {
                method: "POST",
                body: "hehehe"
            })
            console.log(await response.text())
        }
        document.getElementById("theButton").onclick = doSomething
    </script>
    <script>
        async function hehe() {
            let counter = 0
            while (true) {
                await fetch("http://127.0.0.1:30000")
                counter ++
                console.log(counter)
            }
        }
    </script>
</body>
</html>
